services:
  ruoyi-redis:
    image: redis:8.4.0
    container_name: ruoyi-redis
    ports:
      - 6379:6379
    volumes:
      - ./conf/redis/redis.conf:/home/ruoyi/redis/redis.conf
      - ./tmp/redis/data:/data
    command: redis-server /home/ruoyi/redis/redis.conf
    healthcheck:
      test:
        - CMD
        - redis-cli
        - -a
        - ${REDIS_PASSWORD}
        - ping
      interval: 10s # 使用密码检查
      timeout: 5s
      retries: 5
  ruoyi-mysql:
    image: mysql:8.4.7
    container_name: ruoyi-mysql
    restart: unless-stopped
    env_file:
      - ./env/mysql.env
    ports:
      - 3306:3306
    volumes:
      - ./conf/mysql/db:/docker-entrypoint-initdb.d # 初始化 SQL 文件
      - ./tmp/mysql/data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - localhost
      interval: 5s
      timeout: 10s
      retries: 10
  ruoyi-nacos:
    image: nacos/nacos-server:v3.1.1
    container_name: ruoyi-nacos
    restart: unless-stopped
    env_file:
      - ./env/nacos.env
    volumes:
      - ./tmp/nacos/logs/:/home/nacos/logs
    ports:
      - 18080:8080
      - 8848:8848
      - 9848:9848
    depends_on:
      ruoyi-mysql:
        condition: service_healthy

  ruoyi-nginx:
    container_name: ruoyi-nginx
    image: nginx
    build:
      context: ./nginx
    ports:
      - 18000:80
    volumes:
      - ./conf/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./conf/nginx/conf.d:/etc/nginx/conf.d
      # - ./nginx/html/dist:/home/ruoyi/projects/ruoyi-ui
      - ./tmp/nginx/logs:/var/log/nginx
      - ./web/vue:/home/ruoyi/projects/ruoyi-ui
    depends_on:
      ruoyi-gateway:
        condition: service_healthy
  ruoyi-nginx2:
    container_name: ruoyi-nginx2
    image: nginx
    build:
      context: ./nginx
    ports:
      - 18001:80
    volumes:
      - ./conf/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./conf/nginx/conf.d:/etc/nginx/conf.d
      # - ./nginx/html/dist:/home/ruoyi/projects/ruoyi-ui
      - ./tmp/nginx2/logs:/var/log/nginx
      - ./web/vue3:/home/ruoyi/projects/ruoyi-ui
    depends_on:
      ruoyi-gateway:
        condition: service_healthy
  ruoyi-gateway:
    container_name: ruoyi-gateway
    build:
      context: ./ruoyi/gateway
      dockerfile: dockerfile
    ports:
      - 8080:8080
    depends_on:
      ruoyi-redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8080/actuator/health
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
  ruoyi-auth:
    container_name: ruoyi-auth
    build:
      context: ./ruoyi/auth
      dockerfile: dockerfile
    ports:
      - 9200:9200
    depends_on:
      ruoyi-redis:
        condition: service_healthy
  ruoyi-modules-system:
    container_name: ruoyi-modules-system
    build:
      context: ./ruoyi/modules/system
      dockerfile: dockerfile
    ports:
      - 9201:9201
    depends_on:
      ruoyi-redis:
        condition: service_healthy
      ruoyi-mysql:
        condition: service_healthy
  ruoyi-modules-gen:
    container_name: ruoyi-modules-gen
    build:
      context: ./ruoyi/modules/gen
      dockerfile: dockerfile
    ports:
      - 9202:9202
    depends_on:
      ruoyi-mysql:
        condition: service_healthy
  ruoyi-modules-job:
    container_name: ruoyi-modules-job
    build:
      context: ./ruoyi/modules/job
      dockerfile: dockerfile
    ports:
      - 9203:9203
    depends_on:
      ruoyi-mysql:
        condition: service_healthy
  ruoyi-modules-file:
    container_name: ruoyi-modules-file
    build:
      context: ./ruoyi/modules/file
      dockerfile: dockerfile
    ports:
      - 9300:9300
    volumes:
      - ./ruoyi/uploadPath:/home/ruoyi/uploadPath
  ruoyi-visual-monitor:
    container_name: ruoyi-visual-monitor
    build:
      context: ./ruoyi/visual/monitor
      dockerfile: dockerfile
    ports:
      - 9100:9100
